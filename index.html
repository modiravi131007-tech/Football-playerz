<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kickbook | Football Sticker Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1e7cf;--ink:#1a1a1a;--red:#d63a2f;--blue:#1d4ba0;--yellow:#f3c52f;--slot:#b8a77c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Space Mono',monospace;min-height:100vh}
.page{max-width:1000px;margin:0 auto;padding:56px 24px 80px;display:grid;grid-template-columns:1fr 360px;gap:56px;align-items:center}
.kicker{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:3px;margin-bottom:14px}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(64px,11vw,120px);line-height:.88;text-transform:uppercase;color:var(--red);margin-bottom:20px}
.lead{max-width:340px;font-size:15px;margin-bottom:28px}
.search{display:flex;max-width:420px;border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink)}
.search input{flex:1;min-width:0;border:none;outline:none;padding:14px 16px;font-family:inherit;font-size:15px;background:transparent}
.search button{border:none;border-left:3px solid var(--ink);background:var(--yellow);font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:14px;padding:0 20px;cursor:pointer}
.search button:hover{background:var(--ink);color:var(--yellow)}
.message{min-height:22px;margin-top:12px;font-size:13px;color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-family:inherit;font-size:13px;font-weight:700;background:transparent;border:2px solid var(--ink);padding:6px 12px;cursor:pointer}
.chip:hover{background:var(--ink);color:var(--paper)}

.results{margin-top:22px;max-width:420px}
.results h3{font-family:'Archivo Black',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.results ul{list-style:none;border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);max-height:260px;overflow-y:auto}
.results li button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13px;background:transparent;border:none;border-bottom:2px solid var(--ink);padding:10px 14px;cursor:pointer}
.results li:last-child button{border-bottom:none}
.results li button:hover{background:var(--yellow)}
.results li button.active{background:var(--blue);color:#fff}
.results li button strong{display:block;font-size:14px}
.results li button small{opacity:.75;font-size:12px}

.slot{border:3px dashed var(--slot);padding:28px}
.sticker{position:relative;background:#fff;border:3px solid var(--ink);padding:10px;transform:rotate(-2deg);box-shadow:6px 6px 0 var(--ink)}
.num{position:absolute;top:-14px;left:-14px;z-index:2;min-width:48px;height:48px;padding:0 8px;display:grid;place-items:center;background:var(--yellow);border:3px solid var(--ink);border-radius:50%;font-family:'Archivo Black',sans-serif;font-size:18px;transform:rotate(6deg)}
.window{height:270px;width:100%;display:flex;align-items:flex-end;justify-content:center;border:3px solid var(--ink);background:repeating-linear-gradient(45deg,var(--red),var(--red) 14px,#c4322a 14px,#c4322a 28px);overflow:hidden}
.window img{display:block;height:100%;width:100%;max-height:270px;object-fit:contain;object-position:bottom}
.banner{margin-top:10px;padding:10px 12px;background:var(--blue);color:#fff;border:3px solid var(--ink)}
.banner h2{font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1}
.club{margin-top:4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--yellow)}
.stats{display:grid;grid-template-columns:1fr 1.6fr .8fr;margin-top:10px;border:3px solid var(--ink)}
.stats div{padding:8px 10px;border-right:3px solid var(--ink)}
.stats div:last-child{border-right:none}
.stats span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6}
.stats strong{font-size:13px}
.sticker.stick{animation:stick .45s ease-out}
@keyframes stick{0%{transform:translateY(-40px) rotate(-8deg) scale(1.08);opacity:0}70%{transform:translateY(4px) rotate(-1deg) scale(.99);opacity:1}100%{transform:translateY(0) rotate(-2deg) scale(1)}}
@media(max-width:800px){.page{grid-template-columns:1fr;gap:40px;padding:36px 18px 60px}.slot{max-width:360px;margin:0 auto;width:100%}.results{max-width:100%}}
</style>
</head>
<body>
<main class="page">
  <section class="intro">
    <p class="kicker">Album No. 01</p>
    <h1>Kick<br>book</h1>
    <p class="lead">Search any footballer and stick them in your album.</p>
    <form id="search-form" class="search">
      <input id="search-input" type="text" placeholder="Player name" required>
      <button type="submit">Stick it</button>
    </form>
    <p id="message" class="message"></p>
    <div class="chips">
      <button type="button" class="chip" data-name="Messi">Messi</button>
      <button type="button" class="chip" data-name="Ronaldo">Ronaldo</button>
      <button type="button" class="chip" data-name="Mbappe">Mbappé</button>
      <button type="button" class="chip" data-name="Haaland">Haaland</button>
      <button type="button" class="chip" data-name="Neymar">Neymar</button>
    </div>

    <div class="results" id="results" hidden>
      <h3>Not him? Pick another match</h3>
      <ul id="results-list"></ul>
    </div>
  </section>

  <section class="slot">
    <article class="sticker" id="card">
      <div class="num" id="number">#</div>
      <div class="window"><img id="photo" alt="Player photo"></div>
      <div class="banner">
        <h2 id="name">Loading</h2>
        <p class="club" id="club"></p>
      </div>
      <div class="stats">
        <div><span>Pos</span><strong id="position"></strong></div>
        <div><span>Country</span><strong id="country"></strong></div>
        <div><span>Age</span><strong id="age"></strong></div>
      </div>
    </article>
  </section>
</main>

<script>
function getAge(dateBorn) {
  if (!dateBorn) return "N/A";
  const born = new Date(dateBorn);
  const today = new Date();
  let age = today.getFullYear() - born.getFullYear();
  const hadBirthday =
    today.getMonth() > born.getMonth() ||
    (today.getMonth() === born.getMonth() && today.getDate() >= born.getDate());
  if (!hadBirthday) age--;
  return age;
}

function showPlayer(player) {
  const card = document.getElementById("card");
  document.getElementById("name").textContent = player.strPlayer;
  document.getElementById("club").textContent = player.strTeam || "No club listed";
  document.getElementById("position").textContent = player.strPosition || "N/A";
  document.getElementById("country").textContent = player.strNationality || "N/A";
  document.getElementById("age").textContent = getAge(player.dateBorn);
  document.getElementById("number").textContent = player.strNumber ? "#" + player.strNumber : "★";
  document.getElementById("photo").src = player.strCutout || player.strThumb || "";
  card.classList.remove("stick");
  void card.offsetWidth;
  card.classList.add("stick");
}

// Builds the list of all matching players under the search box
function renderResults(players, activeIndex) {
  const box = document.getElementById("results");
  const list = document.getElementById("results-list");
  list.innerHTML = "";

  if (players.length < 2) {
    box.hidden = true;
    return;
  }

  players.forEach(function (player, index) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    if (index === activeIndex) btn.className = "active";

    const title = document.createElement("strong");
    title.textContent = player.strPlayer;

    const sub = document.createElement("small");
    const bits = [player.strTeam, player.strNationality, player.strPosition].filter(Boolean);
    sub.textContent = bits.join(" · ") || "No details listed";

    btn.appendChild(title);
    btn.appendChild(sub);
    btn.addEventListener("click", function () {
      showPlayer(player);
      renderResults(players, index);
    });

    li.appendChild(btn);
    list.appendChild(li);
  });

  box.hidden = false;
}

async function getPlayer(name) {
  const message = document.getElementById("message");
  message.textContent = "Searching...";
  try {
    const url = "https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=" + encodeURIComponent(name);
    const response = await fetch(url);
    const data = await response.json();

    // keep only football (soccer) players
    const players = (data.player || []).filter(function (p) {
      return p.strSport === "Soccer";
    });

    if (players.length === 0) {
      message.textContent = "No football player found. Try just the surname.";
      document.getElementById("results").hidden = true;
      return;
    }

    message.textContent = players.length > 1
      ? players.length + " players found. Pick the right one below."
      : "";
    showPlayer(players[0]);
    renderResults(players, 0);
  } catch (error) {
    message.textContent = "Something went wrong. Check your internet and try again.";
  }
}

document.getElementById("search-form").addEventListener("submit", function (event) {
  event.preventDefault();
  const name = document.getElementById("search-input").value.trim();
  if (name) getPlayer(name);
});

document.querySelectorAll(".chip").forEach(function (chip) {
  chip.addEventListener("click", function () {
    document.getElementById("search-input").value = chip.dataset.name;
    getPlayer(chip.dataset.name);
  });
});

getPlayer("Messi");
</script>
</body>
</html>
